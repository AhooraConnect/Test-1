<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آزمون تعاملی دستگاه مختصات سه‌بعدی</title><style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7fb,#0d1420);--surface:light-dark(#fff,#151e2d);--surface2:light-dark(#eef3f9,#202b3d);--text:light-dark(#152238,#f4f7fb);--muted:light-dark(#607089,#aebbd0);--accent:light-dark(#315efb,#7893ff);--good:#18a566;--bad:#e05252;--border:light-dark(#d9e1ec,#334158)}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Vazirmatn",Arial,sans-serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg);padding:28px 18px 42px}.wrap{max-width:850px;margin:auto}.hero{background:linear-gradient(135deg,#315efb,#6b4eff);color:white;border-radius:24px;padding:28px 26px;margin-bottom:18px;box-shadow:0 14px 35px #315efb2b}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;opacity:.9;line-height:1.8}.bar{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 16px;margin-bottom:14px}.progress{height:8px;background:var(--surface2);border-radius:20px;overflow:hidden;flex:1;margin:0 14px}.progress i{display:block;height:100%;background:var(--accent);width:0;transition:.3s}.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 8px 25px #0000000b}.qnum{color:var(--accent);font-weight:bold;margin-bottom:8px}.q{font-size:20px;font-weight:700;line-height:1.8;margin-bottom:18px}.formula{background:var(--surface2);padding:12px 16px;border-radius:12px;text-align:center;font-size:18px;margin:12px 0 18px;direction:ltr}.opts{display:grid;gap:11px}.opt{border:1px solid var(--border);background:var(--surface);padding:14px 16px;border-radius:13px;cursor:pointer;transition:.18s;display:flex;gap:10px;align-items:center}.opt:hover{border-color:var(--accent);transform:translateY(-1px)}.opt input{accent-color:var(--accent)}.opt.correct{border-color:var(--good);background:#18a56612}.opt.wrong{border-color:var(--bad);background:#e0525212}.feedback{margin-top:16px;padding:13px 15px;border-radius:12px;line-height:1.8;display:none}.feedback.show{display:block}.feedback.good{background:#18a56616;color:var(--good)}.feedback.bad{background:#e0525216;color:var(--bad)}button{border:0;background:var(--accent);color:white;padding:12px 22px;border-radius:12px;font-size:16px;font-family:inherit;cursor:pointer;margin-top:18px}button:disabled{opacity:.45;cursor:not-allowed}.next{display:flex;justify-content:flex-start}.result{text-align:center;padding:32px}.score{font-size:52px;font-weight:800;color:var(--accent);margin:8px}.small{color:var(--muted);font-size:14px}.restart{background:transparent;color:var(--accent);border:1px solid var(--accent)}@media(max-width:600px){#app{padding:18px 12px}.hero h1{font-size:23px}.card{padding:18px}.q{font-size:18px}}
</style></head><body><main id="app"><div class="wrap"><section class="hero"><h1>آزمون تعاملی دستگاه مختصات سه‌بعدی</h1><p>۷ سؤال چهارگزینه‌ای از مباحث مختصات، صفحات، فاصله و نقطهٔ میانی در فضا</p><div style="margin-top:12px;font-size:14px;font-weight:700">تهیه‌کننده: کافه ریاضی</div></section><div id="quiz"></div></div></main><script>
const qs=[
{q:'در دستگاه مختصات سه‌بعدی، هر نقطه با چند مؤلفه مشخص می‌شود؟',a:['۱ مؤلفه','۲ مؤلفه','۳ مؤلفه','۴ مؤلفه'],c:2,e:'هر نقطه در فضا به صورت (x,y,z) نمایش داده می‌شود؛ بنابراین سه مؤلفه دارد.'},
{q:'معادلهٔ صفحهٔ xy کدام است؟',a:['x=0','y=0','z=0','x+y+z=0'],c:2,e:'در صفحهٔ xy، مختصهٔ z برای همهٔ نقاط صفر است.'},
{q:'خطی که با صفحهٔ yz موازی باشد، کدام مختصه در امتداد خط ثابت می‌ماند؟',a:['x','y','z','هیچ‌کدام'],c:0,e:'صفحهٔ yz با x=0 تعریف می‌شود؛ خط موازی آن صفحه می‌تواند در یک مقدار ثابت از x قرار داشته باشد.'},
{q:'فاصلهٔ دو نقطهٔ A(1,2,3) و B(4,6,3) چقدر است؟',a:['۳','۴','۵','۶'],c:2,e:'از فرمول فاصله در فضا: √((4−1)²+(6−2)²+(3−3)²)=√25=5.'},
{q:'نقطهٔ میانی A(2,−1,4) و B(6,3,8) کدام است؟',a:['(4,1,6)','(8,2,12)','(2,1,4)','(3,2,6)'],c:0,e:'هر مؤلفه را میانگین می‌گیریم: ((2+6)/2,(−1+3)/2,(4+8)/2)=(4,1,6).'},
{q:'اگر دو نقطه فقط در مؤلفهٔ x متفاوت باشند، پاره‌خط میان آن‌ها موازی کدام محور است؟',a:['محور x','محور y','محور z','هیچ‌کدام'],c:0,e:'وقتی y و z ثابت باشند و فقط x تغییر کند، مسیر موازی محور x است.'},
{q:'فاصلهٔ جهت‌دار بین دو نقطه بیشتر به چه چیزی توجه دارد؟',a:['فقط اندازهٔ فاصله','اندازه و جهت جابه‌جایی','فقط مؤلفهٔ z','فقط مبدأ مختصات'],c:1,e:'فاصلهٔ جهت‌دار علاوه بر اندازه، جهت جابه‌جایی را نیز با توجه به علامت مؤلفه‌ها در نظر می‌گیرد.'}
];let i=0,score=0,answered=false;const el=document.getElementById('quiz');
function render(){if(i>=qs.length){el.innerHTML=`<div class="card result"><div class="small">آزمون به پایان رسید</div><div class="score">${score} از ۷</div><p>${score===7?'عالی! همهٔ پاسخ‌ها درست بود.':score>=5?'خیلی خوب! چند نکتهٔ کوچک برای مرور باقی مانده.':score>=3?'خوب بود؛ مرور فرمول‌های فاصله و صفحات مختصات کمک می‌کند.':'پیشنهاد می‌کنم مفاهیم پایه و فرمول‌ها را دوباره مرور کنی.'}</p><button class="restart" onclick="i=0;score=0;render()">شروع دوباره</button></div>`;return}const x=qs[i];el.innerHTML=`<div class="bar"><b>سؤال ${i+1} از ۷</b><div class="progress"><i style="width:${i/7*100}%"></i></div><span>${score} امتیاز</span></div><div class="card"><div class="qnum">مبحث ${i<3?'مختصات و صفحات':i<5?'فاصله و نقطهٔ میانی':'فاصلهٔ جهت‌دار و محورها'}</div><div class="q">${x.q}</div><div class="opts">${x.a.map((o,j)=>`<label class="opt"><input type="radio" name="a" value="${j}"><span>${o}</span></label>`).join('')}</div><div id="fb" class="feedback"></div><div class="next"><button id="btn" onclick="check()">ثبت پاسخ</button></div></div>`;answered=false}
function check(){if(answered)return;const sel=document.querySelector('input[name=a]:checked');if(!sel)return;answered=true;const v=+sel.value,x=qs[i],opts=document.querySelectorAll('.opt');opts[x.c].classList.add('correct');if(v===x.c){score++;document.getElementById('fb').className='feedback show good';document.getElementById('fb').textContent='✓ درست! '+x.e}else{opts[v].classList.add('wrong');document.getElementById('fb').className='feedback show bad';document.getElementById('fb').textContent='✗ پاسخ درست: '+x.a[x.c]+' — '+x.e}document.getElementById('btn').textContent=i===qs.length-1?'مشاهدهٔ نتیجه':'سؤال بعدی';document.getElementById('btn').onclick=()=>{i++;render()}}
render();
</script></body></html>
